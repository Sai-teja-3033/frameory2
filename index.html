<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRAMEORY</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
:root{
  --brown:#5a3e2b;
  --light-brown:#8b5e3c;
  --cream:#f5efe6;
}
body{background:var(--cream);color:#2c1c12}

header{
  background:var(--brown);
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}
header h1{letter-spacing:2px}

.header-right{
  display:flex;
  gap:10px;
  align-items:center;
}

.header-right input{
  padding:10px 15px;
  border-radius:25px;
  border:none;
  width:220px;
}

.cart-btn{
  background:var(--light-brown);
  color:white;
  border:none;
  padding:10px 20px;
  border-radius:25px;
  cursor:pointer;
}

/* HERO with IMAGE */
.hero{
  min-height:85vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  color:white;
  background:url("banner.jpg") center/cover no-repeat;
  position:relative;
  padding:20px;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}
.hero *{position:relative;z-index:2}

.hero h2{font-size:3rem}
.hero p{margin:15px 0}
.hero a{
  background:#d4b59a;
  color:#3e2617;
  padding:14px 30px;
  border-radius:30px;
  text-decoration:none;
}

/* PRODUCTS */
.products{
  padding:60px 40px;
  display:grid;
  gap:25px;
  grid-template-columns:repeat(4,1fr);
}
@media(max-width:1024px){
  .products{grid-template-columns:repeat(3,1fr);}
}
@media(max-width:600px){
  header{padding:15px}
  .header-right{width:100%;justify-content:center;margin-top:10px}
  .header-right input{width:65%}
  .products{grid-template-columns:repeat(2,1fr);gap:12px;padding:25px 12px}
}

.card{
  background:white;
  border-radius:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.12);
  padding:12px;
  display:flex;
  flex-direction:column;
}
.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:12px;
}
.card h3{margin:8px 0 4px}
.card p{margin-bottom:10px}
.card button{
  margin-top:auto;
  padding:10px;
  border:none;
  border-radius:25px;
  background:var(--brown);
  color:white;
  cursor:pointer;
}

/* CART */
.cart{
  margin:50px auto;
  padding:40px;
  max-width:900px;
  background:white;
  border-radius:20px;
  box-shadow:0 12px 35px rgba(0,0,0,0.15);
}
.cart h2{margin-bottom:15px}
.cart-item{display:flex;justify-content:space-between;margin-bottom:8px}
.cart input{padding:10px;width:200px;border-radius:20px;border:1px solid #ccc}
.cart button{padding:10px 20px;border:none;border-radius:25px;background:var(--brown);color:white;cursor:pointer}
.total{margin-top:15px;font-size:1.2rem}

/* POPUP */
#popup{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) translateY(-30px);
  background:#d4b59a;
  color:#3e2617;
  padding:12px 25px;
  border-radius:20px;
  opacity:0;
  transition:0.4s;
  z-index:999;
}
#popup.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<body>

<header>
  <h1>FRAMEORY</h1>
  <div class="header-right">
    <input type="text" id="search" placeholder="Search frames..." onkeydown="if(event.key==='Enter'){document.getElementById('shop').scrollIntoView({behavior:'smooth'})}">
    <button class="cart-btn" onclick="scrollToCart()">Cart 🛒</button>
  </div>
</header>

<section class="hero">
  <h2>Frame Your Moments Beautifully</h2>
  <p>Elegant handcrafted photo frames for timeless memories</p>
  <a href="#shop">Explore Collection</a>
</section>

<section class="products" id="shop">
  <div class="card"><img src="https://i.postimg.cc/abcdefg/frame1.jpg"><h3>Classic Frame</h3><p>₹400</p><button onclick="addToCart('Classic Frame',400)">Add to Cart</button></div>
  <div class="card"><img src="https://i.postimg.cc/abcdefg/frame2.jpg"><h3>Walnut Frame</h3><p>₹550</p><button onclick="addToCart('Walnut Frame',550)">Add to Cart</button></div>
  <div class="card"><img src="https://i.postimg.cc/abcdefg/frame3.jpg"><h3>Vintage Frame</h3><p>₹750</p><button onclick="addToCart('Vintage Frame',750)">Add to Cart</button></div>
  <div class="card"><img src="https://i.postimg.cc/abcdefg/frame4.jpg"><h3>Modern Frame</h3><p>₹500</p><button onclick="addToCart('Modern Frame',500)">Add to Cart</button></div>
</section>

<section class="cart" id="cart">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <input type="text" id="coupon" placeholder="Coupon: FRAMEORY10">
  <button onclick="applyCoupon()">Apply</button>
  <p class="total">Total: ₹<span id="total">0</span></p>
</section>

<div id="popup">Added to cart ✔</div>

<script>
let cart=[],total=0,discount=false;

function addToCart(n,p){
  cart.push({n,p}); total+=p; render();
  popup("Added to cart ✔");
}

function render(){
  let box=document.getElementById("cartItems");
  box.innerHTML="";
  cart.forEach(i=>box.innerHTML+=`<div class="cart-item"><span>${i.n}</span><span>₹${i.p}</span></div>`);
  document.getElementById("total").innerText=total.toFixed(2);
}

function popup(msg){
  let p=document.getElementById("popup");
  p.textContent=msg; p.classList.add("show");
  setTimeout(()=>p.classList.remove("show"),1800);
}

function applyCoupon(){
  let code=document.getElementById("coupon").value.trim();
  if(code==="FRAMEORY10" && !discount){
    total*=0.9; discount=true; render(); popup("Coupon Applied 🎉");
  }else popup("Invalid / Used ❌");
}

function scrollToCart(){
  document.getElementById("cart").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
