<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRAMEORY | Premium Photo Frames</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
html,body{overflow-x:hidden;scroll-behavior:smooth;}
:root{
  --brown:#5a3e2b;
  --light-brown:#8b5e3c;
  --cream:#f5efe6;
}
body{background:var(--cream);color:#2c1c12;}

header{
  background:var(--brown);
  color:white;
  padding:15px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
}
header h1{letter-spacing:2px;}
.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}
.header-right input{
  padding:10px 16px;
  border-radius:25px;
  border:none;
  outline:none;
  width:220px;
}
.cart-btn{
  position:relative;
  background:var(--light-brown);
  border:none;
  color:white;
  padding:10px 22px;
  border-radius:25px;
  cursor:pointer;
  white-space:nowrap;
}
.cart-count{
  position:absolute;
  top:-6px;
  right:-6px;
  background:#ff3b3b;
  color:white;
  border-radius:50%;
  padding:2px 7px;
  font-size:12px;
}

.hero{
  min-height:85vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(120deg,#6b4226,#3e2617);
  color:white;
  padding:20px;
}
.hero h2{font-size:clamp(2rem,5vw,3rem);}
.hero p{margin:15px 0;color:#f0e6dc}
.hero a{
  background:#d4b59a;color:#3e2617;
  padding:14px 32px;border-radius:30px;
  text-decoration:none;font-weight:500;
}

.products{
  padding:60px 40px;
  display:grid;
  gap:20px;
  grid-template-columns:repeat(4,1fr);
}
@media(max-width:1024px){.products{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){
  .products{grid-template-columns:repeat(2,1fr);padding:15px 10px;gap:10px;}
  header{flex-direction:column;align-items:center;}
  .header-right{width:100%;justify-content:center;margin-top:10px;flex-wrap:nowrap;}
  .header-right input{width:60%;}
  .cart-btn{margin-left:10px;}
}

.card{
  background:white;border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  transition:.3s;display:flex;flex-direction:column;
  padding:15px;cursor:pointer;
}
.card:hover{transform:translateY(-6px);}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:15px;margin-bottom:15px;}
.card h3{margin-bottom:5px;}
.card p{margin-bottom:10px;}
.card button{
  padding:12px;border:none;border-radius:25px;
  background:var(--brown);color:white;cursor:pointer;margin-bottom:6px;
}

.cart{
  margin:40px auto;padding:40px;
  background:white;border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.15);
  max-width:900px;
}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;}
.qty-box{display:flex;gap:6px;margin-top:10px;}
.qty-box button{padding:4px 10px;border:none;border-radius:10px;background:var(--brown);color:white;cursor:pointer;}
.remove-btn{background:#b33a3a;}
.checkout-btn{
  margin-top:20px;padding:14px 30px;border:none;border-radius:30px;
  background:var(--brown);color:white;cursor:pointer;
}

.coupon-box{
  margin-top:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.coupon-box input{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  outline:none;
}
.coupon-box button{
  padding:10px 22px;
  border:none;border-radius:20px;
  background:var(--light-brown);color:white;cursor:pointer;
}

footer{background:var(--brown);color:#e8dccc;text-align:center;padding:25px;}

#popup{
  position:fixed;top:20px;left:50%;
  transform:translateX(-50%) translateY(-50px);
  background:#d4b59a;color:#3e2617;
  padding:10px 20px;border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  opacity:0;pointer-events:none;transition:.4s;white-space:nowrap;
}
#popup.show{transform:translateX(-50%) translateY(0);opacity:1;}
</style>
</head>
<body>

<header>
  <h1>FRAMEORY</h1>
  <div class="header-right">
    <input type="text" id="search" placeholder="Search frames..." onkeyup="searchProducts(event)">
    <button class="cart-btn" onclick="scrollToCart()">Cart 🛒 <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<section class="hero">
  <h2>Frame Your Moments Beautifully</h2>
  <p>Elegant handcrafted photo frames for timeless memories</p>
  <a href="#shop">Explore Collection</a>
</section>

<section class="products" id="shop"></section>

<section class="cart" id="cart">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>

  <div class="coupon-box">
    <input type="text" id="coupon" placeholder="Enter Coupon Code">
    <button onclick="applyCoupon()">Apply</button>
  </div>

  <p><strong>Total: ₹<span id="total">0</span></strong></p>
  <button class="checkout-btn" onclick="checkoutCart()">Checkout</button>
</section>

<footer>© 2026 FRAMEORY — Crafted With Elegance 🤎</footer>

<div id="popup"></div>

<script>
const products=[
  {name:"Classic Wooden Frame",price:400,img:"https://images.unsplash.com/photo-1589998059171-988d887df646"},
  {name:"Dark Walnut Frame",price:550,img:"https://images.unsplash.com/photo-1618221195710-dd6b41faaea6"},
  {name:"Luxury Vintage Frame",price:750,img:"https://images.unsplash.com/photo-1523413651479-597eb2da0ad6"},
  {name:"Modern Minimal Frame",price:500,img:"https://images.unsplash.com/photo-1524758631624-e2822e304c36"}
];

const shop=document.getElementById("shop");
products.forEach(p=>{
  shop.innerHTML+=`
  <div class="card">
    <img src="${p.img}">
    <h3>${p.name}</h3>
    <p>₹${p.price}</p>
    <button onclick="addToCart('${p.name}',${p.price})">Add to Cart</button>
  </div>`;
});

let cart=[],discountUsed=false;

function renderCart(){
  let total=0,box=document.getElementById("cartItems");box.innerHTML="";
  cart.forEach((i,idx)=>{
    total+=i.price*i.qty;
    box.innerHTML+=`<div class="cart-item">${i.name} x ${i.qty} <b>₹${i.price*i.qty}</b></div>`;
  });
  document.getElementById("total").innerText=total;
}

function addToCart(name,price){
  let item=cart.find(i=>i.name===name);
  if(item)item.qty++; else cart.push({name,price,qty:1});
  renderCart(); showPopup("Added to Cart 🛒");
}

function applyCoupon(){
  const code=document.getElementById("coupon").value.trim();
  if(code==="FRAMEORY10" && !discountUsed){
    let total=Number(document.getElementById("total").innerText);
    document.getElementById("total").innerText=(total*0.9).toFixed(0);
    discountUsed=true;
    showPopup("Coupon Applied 🎉");
  }else{
    showPopup("Invalid / Used Coupon ❌");
  }
}

function showPopup(msg){
  const p=document.getElementById("popup");
  p.textContent=msg;p.classList.add("show");
  setTimeout(()=>p.classList.remove("show"),2000);
}
function scrollToCart(){document.getElementById("cart").scrollIntoView({behavior:"smooth"});}
function checkoutCart(){showPopup("Checkout Coming Soon 💳");}
</script>

</body>
</html>
