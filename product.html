<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Product Details | FRAMEORY</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins;background:#f5efe6}
.container{max-width:1100px;margin:auto;padding:40px}
.back{display:inline-block;margin-bottom:20px;color:#5a3e2b;text-decoration:none;font-weight:500;cursor:pointer}
.product{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.main-img{width:100%;border-radius:20px}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent}
.thumbs img.active{border-color:#5a3e2b}
h1{margin:0}
.price{font-size:1.4rem;margin:10px 0}
button{
  padding:12px 28px;
  border:none;
  border-radius:25px;
  background:#5a3e2b;
  color:white;
  cursor:pointer;
  margin-right:10px;
  margin-bottom:10px;
}
header {
  background:#5a3e2b;
  color:white;
  padding:15px 40px;
  display:flex;
  justify-content:center;  /* centers FRAMEORY */
  align-items:center;
  position: relative;      /* for absolute positioning of cart */
}

header h1 {
  letter-spacing:2px;
  cursor:pointer;
  text-align:center;
  margin:0;
}

header button {
  position: absolute;       /* position cart independently */
  right: 40px;              /* distance from right edge */
  background:#d4b59a;
  color:#3e2617;
  padding:8px 16px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:500;
}

header button:hover {
  background:#bfa07c;
}


@media(max-width:600px){
  header{
    padding:15px 20px;
    justify-content:center;
  }
}

button:hover{background:#8b5e3c}
.review{background:white;padding:15px;border-radius:12px;margin-top:15px}
#popup{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-50px);background:#d4b59a;color:#3e2617;padding:15px 30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:transform 0.5s ease, opacity 0.5s ease;font-weight:500;z-index:9999;}
#popup.show{transform:translateX(-50%) translateY(0);opacity:1;}
@media(max-width:768px){
  .product{grid-template-columns:1fr}
}
.main-img{
  user-select:none;          /* prevents text selection while swiping */
  -webkit-user-drag:none;    /* prevents dragging the image accidentally */
}
@media(max-width:600px){
  header button {
    right: 20px; /* match header padding */
    padding:6px 12px;
  }
}

</style>
</head>
<body>
 <header>
  <h1 onclick="window.location.href='index.html'">FRAMEORY</h1>
  <button id="headerCart" onclick="goToCart()">🛒(<span id="cartCount">0</span>)</button>
</header>



<div class="container">
  <!-- GitHub-ready back button -->
  <a href="index.html" class="back">← Back to Shop</a>
  <div class="product" id="productBox"></div>
</div>

<div id="popup"></div>

<script>
    

// ---------------- Product Database ----------------
const products = {
  "classic-wooden-frame":{
    name:"Classic Wooden Frame", price:400,
    images:["https://i.postimg.cc/TYnVfnCJ/51w-MS0Q8N2L-AC-AIweblab1006854-T4-FMavif-SF1050-1050-PQ64.avif","https://i.postimg.cc/PxBDkqD2/4c1baaa5-8f15-4043-986d-561e03ceef85.jpg","https://i.postimg.cc/wj6mzZ1G/51OPds-Zk-Wr-L-AC-AIweblab1006854-T4-FMavif-SF1050-1050-PQ64.avif"],
    desc:"Handcrafted wooden frame with elegant finish. Perfect for your memories.",
    reviews:["⭐️⭐️⭐️⭐️⭐️ Beautiful quality!","⭐️⭐️⭐️⭐️ Looks premium."]
  },
  "dark-walnut-frame":{
    name:"Dark Walnut Frame", price:550,
    images:["https://images.unsplash.com/photo-1618221195710-dd6b41faaea6","https://images.unsplash.com/photo-1519710164239-da123dc03ef4","https://images.unsplash.com/photo-1524758631624-e2822e304c36"],
    desc:"Rich walnut texture for modern & luxury interiors.",
    reviews:["⭐️⭐️⭐️⭐️ Classy look!"]
  },
  "luxury-vintage-frame":{
    name:"Luxury Vintage Frame", price:750,
    images:["https://images.unsplash.com/photo-1523413651479-597eb2da0ad6","https://images.unsplash.com/photo-1519710164239-da123dc03ef4"],
    desc:"Elegant vintage style frame that adds a luxury touch to any room.",
    reviews:["⭐️⭐️⭐️⭐️⭐️ Absolutely love it!","⭐️⭐️⭐️⭐️ High quality and finish."]
  },
  "modern-minimal-frame":{
    name:"Modern Minimal Frame", price:500,
    images:["https://images.unsplash.com/photo-1524758631624-e2822e304c36","https://images.unsplash.com/photo-1589998059171-988d887df646"],
    desc:"Sleek minimal design frame for contemporary interiors.",
    reviews:["⭐️⭐️⭐️⭐️ Clean and simple design!"]
  }
};

// ---------------- Load Product ----------------
const params = new URLSearchParams(window.location.search);
const id = params.get("product");
const p = products[id];

if(!p){ document.getElementById("productBox").innerHTML="<p>Product not found!</p>"; }

// Render product
let images = p.images;       // global array of product images
let currentIndex = 0;        // tracks current main image
let startX = 0;              // for swipe detection
let gallery = p.images.map((img,i)=>`<img src="${img}" class="${i===0?'active':''}" onclick="setMain(this)">`).join("");
document.getElementById("productBox").innerHTML = `
  <div>
    <img src="${p.images[0]}" class="main-img" id="mainImg">
    <div class="thumbs">${gallery}</div>
  </div>
  <div>
    <h1>${p.name}</h1>
    <p class="price">₹${p.price}</p>
    <p>${p.desc}</p>
    <button onclick="addToCart('${p.name}',${p.price})">Add to Cart</button>
    <h3>Reviews</h3>
    ${p.reviews.map(r=>`<div class="review">${r}</div>`).join("")}
  </div>
`;

// ---------------- Functions ----------------
const mainImg = document.getElementById("mainImg");

// Thumbnail click already calls setMain(img) (no change needed)

// Touch/swipe events
mainImg.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

mainImg.addEventListener("touchend", e => {
  let endX = e.changedTouches[0].clientX;
  let diff = startX - endX;

  if(Math.abs(diff) > 50){ // swipe threshold
    if(diff > 0){
      nextImage();
    } else {
      prevImage();
    }
  }
});

function nextImage(){
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

function prevImage(){
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}
function setMain(img){
  const thumbs = document.querySelectorAll(".thumbs img"); // get all thumbnail images
  currentIndex = Array.from(thumbs).indexOf(img);         // find index of clicked thumbnail
  updateImage();                                          // update the main image
}

function updateImage(){
  mainImg.src = images[currentIndex];                     // update main image
  document.querySelectorAll(".thumbs img").forEach((img,i)=>{
    img.classList.toggle("active", i === currentIndex);  // highlight active thumbnail
  });
}




let cart = JSON.parse(localStorage.getItem("cart")||"[]");
function saveCart(){ localStorage.setItem("cart",JSON.stringify(cart)); }

function showPopup(message){
  const popup=document.getElementById("popup");
  popup.textContent = message;
  popup.classList.add("show");
  setTimeout(()=>popup.classList.remove("show"),2000);
}
// Update cart count in header
function updateHeaderCart() {
  const count = cart.reduce((sum, i) => sum + i.qty, 0);
  document.getElementById("cartCount").textContent = count;
}

// Call whenever page loads or cart changes
updateHeaderCart();

// Go to cart page
function goToCart() {
  window.location.href = 'cart.html'; // create cart.html later
}

// Modify addToCart to also update header count
function addToCart(name, price){
  let item = cart.find(i=>i.name === name);

  if(item){
    item.qty++;
  } else {
    cart.push({
      name,
      basePrice: price,
      qty: 1
    });
  }

  saveCart();
  updateHeaderCart();   // <-- update count
  showPopup("Added to Cart 🛒");
}

</script>

</body>
</html>
