<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Product Details | FRAMEORY</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  body {margin:0; font-family:Poppins; background:#f5efe6;}
  a.back {display:inline-block; margin-bottom:20px; color:#5a3e2b; text-decoration:none; font-weight:500; cursor:pointer;}

  /* Header */
  header {
    background:#5a3e2b;
    color:white;
    padding:20px 40px;
    text-align:center;
  }
  header h1 {
    letter-spacing:2px;
    cursor:pointer;
    margin-bottom:15px;
  }
  .header-right {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    position:relative;
  }
  .header-right input {
    padding:10px 16px;
    border-radius:25px;
    border:none;
    outline:none;
    width:220px;
  }
  .cart-btn {
    position:relative;
    background:#d4b59a;
    border:none;
    color:#3e2617;
    padding:10px 22px;
    border-radius:25px;
    cursor:pointer;
    white-space:nowrap;
  }
  .cart-btn:hover {background:#bfa07c;}
  .cart-count {
    position:absolute;
    top:-6px;
    right:-6px;
    background:#ff3b3b;
    color:white;
    border-radius:50%;
    padding:2px 7px;
    font-size:12px;
  }

  /* Search Suggestions */
  .search-suggestions {
    position:absolute;
    top:48px;
    left:0;
    right:0;
    background:white;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
    overflow:hidden;
    z-index:999;
    display:none;
  }
  .search-suggestions div {
    padding:10px 16px;
    cursor:pointer;
    color:#000;
    font-weight:500;
  }
  .search-suggestions div:hover {
    background:#f2e6d8;
    color:#3e2617;
  }

  /* Container */
  .container {max-width:1100px; margin:auto; padding:40px;}
  .product {display:grid; grid-template-columns:1fr 1fr; gap:40px;}
  .main-img {width:100%; border-radius:20px; user-select:none; -webkit-user-drag:none;}
  .thumbs {display:flex; gap:10px; margin-top:10px;}
  .thumbs img {width:70px; height:70px; object-fit:cover; border-radius:10px; cursor:pointer; border:2px solid transparent;}
  .thumbs img.active {border-color:#5a3e2b;}
  h1 {margin:0;}
  .price {font-size:1.4rem; margin:10px 0;}
  button {
    padding:12px 28px;
    border:none;
    border-radius:25px;
    background:#5a3e2b;
    color:white;
    cursor:pointer;
    margin-right:10px;
    margin-bottom:10px;
  }
  button:hover {background:#8b5e3c;}
  .review {background:white; padding:15px; border-radius:12px; margin-top:15px;}
  #popup {
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%) translateY(-50px);
    background:#d4b59a;
    color:#3e2617;
    padding:15px 30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
    opacity:0;
    pointer-events:none;
    transition:transform 0.5s ease, opacity 0.5s ease;
    font-weight:500;
    z-index:9999;
  }
  #popup.show {transform:translateX(-50%) translateY(0); opacity:1;}

  /* Responsive */
  @media(max-width:768px) { .product {grid-template-columns:1fr;} }
  @media(max-width:600px){
    header {padding:15px 20px;}
    .header-right {width:100%; justify-content:center; gap:5px;}
    .header-right input {width:60%;}
    header button {padding:6px 12px;}
  }
</style>
</head>
<body>

<header>
  <h1 onclick="window.location.href='index.html'">FRAMEORY</h1>
  <div class="header-right">
    <input type="text" id="search" placeholder="Search frames..." onkeyup="searchProducts(event)">
    <div class="search-suggestions" id="suggestions"></div>
    <button class="cart-btn" id="headerCart" onclick="goToCart()">
      Cart 🛒 <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<div class="container">
  <a href="index.html" class="back">← Back to Shop</a>
  <div class="product" id="productBox"></div>
</div>

<div id="popup"></div>

<script>
  // -------- Product Database --------
  const products = {
    "classic-wooden-frame": {
      name:"Classic Wooden Frame", price:400,
      images:["https://i.postimg.cc/TYnVfnCJ/51w-MS0Q8N2L-AC-AIweblab1006854-T4-FMavif-SF1050-1050-PQ64.avif","https://i.postimg.cc/PxBDkqD2/4c1baaa5-8f15-4043-986d-561e03ceef85.jpg","https://i.postimg.cc/wj6mzZ1G/51OPds-Zk-Wr-L-AC-AIweblab1006854-T4-FMavif-SF1050-1050-PQ64.avif"],
      desc:"Handcrafted wooden frame with elegant finish. Perfect for your memories.",
      reviews:["⭐️⭐️⭐️⭐️⭐️ Beautiful quality!","⭐️⭐️⭐️⭐️ Looks premium."]
    },
    "dark-walnut-frame": {
      name:"Dark Walnut Frame", price:550,
      images:["https://images.unsplash.com/photo-1618221195710-dd6b41faaea6","https://images.unsplash.com/photo-1519710164239-da123dc03ef4","https://images.unsplash.com/photo-1524758631624-e2822e304c36"],
      desc:"Rich walnut texture for modern & luxury interiors.",
      reviews:["⭐️⭐️⭐️⭐️ Classy look!"]
    },
    "luxury-vintage-frame": {
      name:"Luxury Vintage Frame", price:750,
      images:["https://images.unsplash.com/photo-1523413651479-597eb2da0ad6","https://images.unsplash.com/photo-1519710164239-da123dc03ef4"],
      desc:"Elegant vintage style frame that adds a luxury touch to any room.",
      reviews:["⭐️⭐️⭐️⭐️⭐️ Absolutely love it!","⭐️⭐️⭐️⭐️ High quality and finish."]
    },
    "modern-minimal-frame": {
      name:"Modern Minimal Frame", price:500,
      images:["https://images.unsplash.com/photo-1524758631624-e2822e304c36","https://images.unsplash.com/photo-1589998059171-988d887df646"],
      desc:"Sleek minimal design frame for contemporary interiors.",
      reviews:["⭐️⭐️⭐️⭐️ Clean and simple design!"]
    }
  };

  // -------- Load Product --------
  const params = new URLSearchParams(window.location.search);
  const id = params.get("product");
  const p = products[id];

  if(!p){ document.getElementById("productBox").innerHTML="<p>Product not found!</p>"; }

  let images = p.images;
  let currentIndex = 0;
  let startX = 0;

  let gallery = p.images.map((img,i)=>`<img src="${img}" class="${i===0?'active':''}" onclick="setMain(this)">`).join("");
  document.getElementById("productBox").innerHTML = `
    <div>
      <img src="${p.images[0]}" class="main-img" id="mainImg">
      <div class="thumbs">${gallery}</div>
    </div>
    <div>
      <h1>${p.name}</h1>
      <p class="price">₹${p.price}</p>
      <p>${p.desc}</p>
      <button onclick="addToCart('${p.name}',${p.price})">Add to Cart</button>
      <h3>Reviews</h3>
      ${p.reviews.map(r=>`<div class="review">${r}</div>`).join("")}
    </div>
  `;

  const mainImg = document.getElementById("mainImg");

  // Swipe for mobile
  mainImg.addEventListener("touchstart", e => { startX = e.touches[0].clientX; });
  mainImg.addEventListener("touchend", e => {
    let diff = startX - e.changedTouches[0].clientX;
    if(Math.abs(diff) > 50){ diff > 0 ? nextImage() : prevImage(); }
  });

  function searchProducts(e){
    let val = document.getElementById("search").value.toLowerCase();
    const sug = document.getElementById("suggestions");
    if(!val){ sug.style.display="none"; return; }

    const filtered = Object.keys(products).filter(k => products[k].name.toLowerCase().includes(val));
    sug.innerHTML = "";
    filtered.forEach(k => {
      let div = document.createElement("div");
      div.innerText = products[k].name;
      div.onclick = ()=>{ window.location.href="product.html?product="+k; };
      sug.appendChild(div);
    });
    sug.style.display = filtered.length ? "block" : "none";

    if(e && e.key==="Enter" && filtered.length){ window.location.href="product.html?product="+filtered[0]; }
  }

  function nextImage(){ currentIndex=(currentIndex+1)%images.length; updateImage(); }
  function prevImage(){ currentIndex=(currentIndex-1+images.length)%images.length; updateImage(); }
  function setMain(img){
    currentIndex=Array.from(document.querySelectorAll(".thumbs img")).indexOf(img);
    updateImage();
  }
  function updateImage(){
    mainImg.src=images[currentIndex];
    document.querySelectorAll(".thumbs img").forEach((img,i)=>img.classList.toggle("active", i===currentIndex));
  }

  // -------- Cart Logic --------
  let cart = JSON.parse(localStorage.getItem("cart")||"[]");
  function saveCart(){ localStorage.setItem("cart",JSON.stringify(cart)); }
  function showPopup(msg){
    const popup=document.getElementById("popup");
    popup.textContent=msg;
    popup.classList.add("show");
    setTimeout(()=>popup.classList.remove("show"),2000);
  }
  function updateHeaderCart(){
    const count = cart.reduce((sum,i)=>sum+i.qty,0);
    document.getElementById("cartCount").textContent=count;
  }
  updateHeaderCart();
  function goToCart(){ window.location.href='cart.html'; }
  function addToCart(name,price){
    let item = cart.find(i=>i.name===name);
    if(item) item.qty++; else cart.push({name, basePrice:price, qty:1});
    saveCart();
    updateHeaderCart();
    showPopup("Added to Cart 🛒");
  }
</script>

</body>
</html>
